# golangci-lint v2 configuration for every module of the Go workspace; run
# through `just golangci`, which pins the version.
version: "2"

run:
  # Paths in rules below are relative to this file.
  relative-path-mode: cfg

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - perfsprint
    - revive
    - unparam
    - usestdlibvars
  settings:
    gosec:
      excludes:
        # Byte-wise encoding (lengths, UTF-16 units, big-endian sums) truncates
        # on purpose; such conversions are masked or bounded beforehand.
        - G115
    nolintlint:
      require-specific: true
      require-explanation: true
  exclusions:
    # Generated code (Code generated ... DO NOT EDIT) keeps its generator's output.
    generated: strict
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      # OID blocks carry one comment per group, as go doc renders them.
      - linters: [revive]
        text: "exported: (comment on exported var|exported var) OID"
      # pkcs12.PKCS12Attribute is public API since v0.5 and keeps its name.
      - path: pkcs12/pkcs12\.go
        linters: [revive]
        text: stutters
      # Brainpool keys only exist on the deprecated crypto/elliptic and big.Int
      # API; secret scalars go through internal/bp256 (see brainpool/staticcheck.conf).
      - path: brainpool/
        linters: [staticcheck]
        text: SA1019
      # priv.Curve.ScalarMult reads as curve arithmetic; priv.ScalarMult would
      # read as a method of the key.
      - path: brainpool/
        linters: [staticcheck]
        text: "QF1008: could remove embedded field \"(Curve|PublicKey)\""
      # josebp.JWT.HeadersJson/PayloadJson and JSONWebKey.Algortihm are public API since v1.
      - path: brainpool/josebp/
        linters: [revive]
        text: "var-naming: struct field (HeadersJson|PayloadJson)"
      - path: brainpool/josebp/
        linters: [misspell]
        text: Algortihm
      # Point methods name the destination q and the operand p, as nistec does.
      - path: brainpool/internal/bp256/point\.go
        linters: [revive]
        text: receiver-naming
      # pkcs12/legacy exists to read the weak algorithms of old files.
      - path: pkcs12/legacy/
        linters: [gosec]
        text: "G40[15]"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/gematik/zero-lab
  exclusions:
    generated: strict
