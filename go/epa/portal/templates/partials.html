{{ define "curl" -}}
<div class="code">
  <button class="copy btn btn-sm btn-outline-secondary" type="button" aria-label="In Zwischenablage kopieren">Copy</button>
  <pre><code class="language-bash">{{ . }}</code></pre>
</div>
{{- end }}

{{ define "json" -}}
<div class="response"><pre><code class="language-json">{{ . }}</code></pre></div>
{{- end }}

{{ define "execute-button" -}}
<button class="execute btn btn-primary" type="button">
  <span class="spinner-border spinner-border-sm d-none me-1" aria-hidden="true"></span>Ausführen
</button>
{{- end }}

{{ define "result" -}}
<div class="result mt-3 d-none">
  <div class="status small mb-2"></div>
  <div class="output"></div>
</div>
{{- end }}
