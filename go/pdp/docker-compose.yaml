# Airgapped zero-pdp: the PDP runs in NonProdMode with a baked-in mock IdP (PDP_NON_PROD=true), so it
# authenticates users with a canned identity — no external OpenID Provider, zero network egress. Mount your
# config dir (pdp.yaml with mock_idp + a test client/product, openid-providers.yaml, sign.jwk) at /etc/pdp.
# Postgres backs the kv store, sealed under the key file in PDP_STORE_KEY_PATH; zero-pdp refuses to start without it,
# and nothing makes it for you. Make it once, in the mounted config dir:
#   printf 'k1 %s\n' "$(openssl rand -base64 32)" > config/store.key
# Drop DATABASE_URL and PDP_STORE_KEY_PATH for an in-memory store, for one replica.
services:
  postgres:
    image: postgres:18-alpine
    container_name: zero-pdp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zero
      POSTGRES_USER: zero
      POSTGRES_PASSWORD: zero
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 keeps its data in /var/lib/postgresql/18/docker and refuses a volume at the old
      # .../data path; a new volume name keeps Postgres 16 data out of it.
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zero -d zero"]
      interval: 5s
      timeout: 3s
      retries: 5

  zero-pdp:
    build:
      context: .. # the go/ workspace root (for go.work)
      dockerfile: pdp/cmd/zero-pdp/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PDP_NON_PROD: "true"
      DATABASE_URL: "postgres://zero:zero@postgres:5432/zero?sslmode=disable"
      PDP_STORE_KEY_PATH: "/etc/pdp/store.key"
    volumes:
      - ./config:/etc/pdp:ro # pdp.yaml (mock_idp + non_prod) + openid-providers.yaml + sign.jwk + store.key
    ports:
      - "${PDP_HOST_PORT:-8011}:8011"
    command: ["start"]

volumes:
  postgres18-data:
