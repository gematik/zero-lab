# openid-providers.yaml — the identity providers, run in parallel. pep loads it from
# PEP_OPENID_PROVIDERS_PATH (default ./openid-providers.yaml). The same flat format is what pdp references by
# path, so copy this to openid-providers.yaml and fill it in.
#
# Each entry is the provider's own package config type: openid.Config, idpd.ClientConfig,
# oidf.FileConfig. ${VAR} placeholders expand from the environment / a .env in the workdir.
# Each oidc/idpd uses <PEP_PUBLIC_URL>/oauth2/callback unless it sets its own redirect_uri. logo_uri is the
# chooser icon (OIDF brings its federation IdPs' logos built in).

oidc:
  - issuer: https://accounts.google.com
    client_id: "<google-client-id>"
    client_secret: "<secret>"
    scopes: [openid, email, profile]
    name: Google
    logo_uri: https://www.google.com/favicon.ico
  - issuer: https://login.microsoftonline.com/<tenant>/v2.0
    client_id: "<entra-client-id>"
    client_secret: "<secret>"
    name: Microsoft Entra
    logo_uri: https://www.microsoft.com/favicon.ico

idpd:
  - client_id: "<idpd-client-id>"
    environment: ref # test|ref|prod, required: it decides which anchors are trusted
    trust_fetch: true # download the trust material from gematik's hosts, or for an air-gapped site:
    # trust_bundle_path: /etc/telematik/ti-trust-bundle.json # from `ti pki trust export`
    redirect_uri: https://<host>/idpd-callback
    scopes: [openid, gmtik-zerotrust-poc]
    name: gematik IDP-Dienst
    logo_uri: https://www.gematik.de/favicon.ico

# One OIDF relying party (oidf.FileConfig); contributes the federation's IdPs (each with its logo).
# Its keys are PEM files (EC P-256, SEC 1 or PKCS #8) that zero-pep-proxy reads; relative key paths resolve against
# THIS file's directory.
oidf:
  entity: https://<host>
  master: https://app-ref.federationmaster.de
  # Or, instead of master, the location of the master's entity configuration; the entity identifier is the
  # part before /.well-known/openid-federation. An unlisted master needs master_jwk_path, the file of its signing key as a JWK, obtained out of band.
  # master_entity_statement_uri: https://app-ref.federationmaster.de/.well-known/openid-federation
  # A registered RP MUST pin the kids it registered at the fed master (else the OP can't match the signing
  # key). Omit kid only for a brand-new RP — it then defaults to the RFC 7638 thumbprint.
  sign_key: { key_pem_path: ./secrets/sig_prk.pem, kid: <sig-kid> }
  enc_key: { key_pem_path: ./secrets/enc_prk.pem, kid: <enc-kid> }
  client_key: { key_pem_path: ./secrets/client_prk.pem, cert_pem_path: ./secrets/client_cert.pem, kid: <client-kid> }
  relying_party:
    client_name: My Relying Party
    organization_name: My Organization
    redirect_uris: [https://<host>/oauth2/callback]
    # gemSpec_IDP_FD A_23034-02 and A_27505 require these of every registered relying party.
    keywords: ["product_type:<product type>", "product_type_version:<product type version>"]
    contacts: [support@example.invalid]
    # Both versions of gemSpec_IDP_FD A_27505 are read; the IDP issues the highest both sides list (A_27598).
    ti_features_supported: { id_token_version_supported: ["1.0.0"] }
  federation_entity:
    name: My Relying Party
