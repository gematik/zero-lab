[workspace]
members = ["ti-types", "ti-cache", "ti-pki", "ti-pkcs12", "ti-cli"]
resolver = "3"

# Shared metadata only. Deliberately no workspace.package.version: every crate is
# versioned independently by its own tag rust/<crate>/vX.Y.Z (see docs/development.md).
[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/gematik/zero-lab"
authors = ["gematik GmbH"]
# Until the registry/crates.io decision; flipped here once for every crate.
publish = false

[workspace.dependencies]
# In-repo crates: path for local development, version for registry resolution.
ti-types = { version = "0.1", path = "ti-types" }
ti-cache = { version = "0.1", path = "ti-cache" }
ti-pki = { version = "0.1", path = "ti-pki" }
ti-pkcs12 = { version = "0.1", path = "ti-pkcs12" }

# External. Pinned here once, inherited by every crate.
der = { version = "0.8", features = ["alloc", "derive", "oid"] }
x509-cert = "0.3"
spki = { version = "0.8", default-features = false, features = ["alloc"] }
const-oid = "0.10"
pem-rfc7468 = "1"
# PKCS#12: PBES2 (PBKDF2 + AES-CBC) and the key/MAC primitives; the legacy PKCS#12 PBEs
# (3DES, RC2) that gematik's test cards still use sit behind ti-pkcs12's `legacy` feature.
pkcs5 = { version = "0.8.1", default-features = false, features = ["alloc", "pbes2"] }
pkcs8 = { version = "0.11.0", default-features = false, features = ["alloc"] }
hmac = "0.13.0"
cbc = { version = "0.2.1", default-features = false, features = ["alloc", "block-padding"] }
des = "0.9.0"
rc2 = "0.9.0"
zeroize = { version = "1.8.2", default-features = false, features = ["alloc"] }
thiserror = "2"
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
clap = { version = "4.6.7", default-features = false, features = ["derive"] }
clap_complete = { version = "4.6.11", default-features = false }
# Terminal styling for the CLI; the same crates clap renders its own help with.
anstream = "1.0.0"
anstyle = "1.0.14"
# Local time zone for timestamps in text output (system zone, DST-correct, Windows too).
jiff = "0.2.37"
arc-swap = "1.9.2"
minicbor = { version = "2.3.0", default-features = false, features = ["alloc"] }
sha2 = "0.11"
# OCSP CertIDs only: TI responders expect SHA-1 there (RFC 5019); never for integrity.
sha1 = { version = "0.11", default-features = false }
# Signature verification: one trait (pki-types), RustCrypto implementations behind it.
rustls-pki-types = { version = "1.15.1", default-features = false }
ecdsa = { version = "0.17.0", default-features = false, features = ["der", "algorithm"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
bp256 = { version = "0.14.0", default-features = false, features = ["arithmetic", "ecdsa", "sha256"] }
bp384 = { version = "0.14.0", default-features = false, features = ["arithmetic", "ecdsa", "sha384"] }
# Release candidate: the only rsa line on the current RustCrypto stack (docs/development.md).
rsa = { version = "=0.10.0-rc.18", default-features = false, features = ["encoding", "sha2"] }
digest = "0.11"
# Adapters behind ti-pki features; the caller's own reqwest dependency brings TLS.
reqwest = { version = "0.13.5", default-features = false }
tokio = { version = "1.53.1", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# ti-cli's HTTP: blocking ureq on rustls with ring passed explicitly, as in kartos; no
# async runtime, no aws-lc build.
ureq = { version = "3.4.2", default-features = false }
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12", "ring"] }

serde_json = "1.0.151"
# XML through serde, matching local names (as in the zero-lab generator projects).
quick-xml = { version = "0.42.0", default-features = false, features = ["serialize", "overlapped-lists"] }
base64ct = { version = "1.8.3", features = ["alloc"] }

# Test-only.
futures-lite = "2.6.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# gematik spec identifiers (gemSpec_PKI, Tab_PKI_405, A_28419, SE_1016) are prose
# in these docs, not code; backticking every one would only hurt readability.
doc_markdown = "allow"
# Async trait impls must be async even when an implementation never awaits (memory
# store, file transport); the trait, not the impl, decides.
unused_async_trait_impl = "allow"

# Release builds are what `just install` and distributed binaries use: stripped, whole
# program optimised, aborting on panic (nothing catches one; the CLI's only panics are
# programming errors). ti-cli shrinks from 6.2 to 3.5 MB on aarch64-apple-darwin.
[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"
