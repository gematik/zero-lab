[workspace]
members = ["ti-types", "ti-cache", "ti-pki", "ti-pkcs12", "ti-connector-client", "ti-report", "ti-cli", "ti-wasm", "jwz", "ti-jwz", "ti-jwks", "ti-tls", "ti-idpd", "ti-directory", "unsafe-audit", "traceability"]
# cargo-fuzz targets need nightly and a dependency tree of their own.
exclude = ["jwz/fuzz"]
resolver = "3"

# Shared metadata only. Deliberately no workspace.package.version: every crate is
# versioned independently by its own tag rust/<crate>/vX.Y.Z (see docs/development.md).
[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "EUPL-1.2"
repository = "https://github.com/gematik/zero-lab"
authors = ["gematik GmbH"]
# Off until a crate is released to crates.io; a released crate sets its own (jwz).
publish = false

[workspace.dependencies]
# In-repo crates: path for local development, version for registry resolution.
ti-types = { version = "0.1", path = "ti-types" }
ti-cache = { version = "0.1", path = "ti-cache" }
# Without its default algorithm features: parsing certificates needs none.
ti-pki = { version = "0.1", path = "ti-pki", default-features = false }
ti-pkcs12 = { version = "0.1", path = "ti-pkcs12" }
ti-connector-client = { version = "0.1", path = "ti-connector-client" }
ti-report = { version = "0.1", path = "ti-report" }
jwz = { version = "0.1", path = "jwz", default-features = false }
ti-jwz = { version = "0.1", path = "ti-jwz" }
ti-idpd = { version = "0.1", path = "ti-idpd" }
ti-jwks = { version = "0.1", path = "ti-jwks" }
ti-tls = { version = "0.1", path = "ti-tls" }
ti-directory = { version = "0.1", path = "ti-directory" }
# Dev-only: the traceability tables (tests/traceability.rs); never published.
traceability = { path = "traceability" }

# External. Pinned here once, inherited by every crate.
der = { version = "0.8", features = ["alloc", "derive", "oid"] }
x509-cert = "0.3"
spki = { version = "0.8", default-features = false, features = ["alloc"] }
const-oid = "0.10"
pem-rfc7468 = "1"
# PKCS#12: PBES2 (PBKDF2 + AES-CBC) and the key/MAC primitives; the legacy PKCS#12 PBEs
# (3DES, RC2) that gematik's test cards still use sit behind ti-pkcs12's `legacy` feature.
# No pkcs5: its `pbes2` feature brings scrypt, which PKCS#12 never uses (TASK-56).
aes = { version = "0.9.3", default-features = false }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
pkcs8 = { version = "0.11.0", default-features = false, features = ["alloc"] }
# The `ECPrivateKey` inside a PKCS#8 EC key (ti-cli's identity loader); already in the
# tree through elliptic-curve.
sec1 = { version = "0.8.1", default-features = false, features = ["der", "alloc"] }
hmac = "0.13.0"
cbc = { version = "0.2.1", default-features = false, features = ["alloc", "block-padding"] }
des = "0.9.0"
rc2 = "0.9.0"
zeroize = { version = "1.8.2", default-features = false, features = ["alloc"] }
thiserror = "2"
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
clap = { version = "4.6.7", default-features = false, features = ["derive"] }
clap_complete = { version = "4.6.11", default-features = false }
# Terminal styling for the CLI; the same crates clap renders its own help with.
anstream = "1.0.0"
anstyle = "1.0.14"
# Local time zone for timestamps in text output (system zone, DST-correct, Windows too).
# ti-cli only; std has no time zones, and UTC is not what a user compares a card's or a
# certificate's time with (TASK-58).
jiff = "0.2.37"
sha2 = "0.11"
# OCSP CertIDs only: TI responders expect SHA-1 there (RFC 5019); never for integrity.
sha1 = { version = "0.11", default-features = false }
# Signature verification: one trait (pki-types), RustCrypto implementations behind it.
rustls-pki-types = { version = "1.15.1", default-features = false }
ecdsa = { version = "0.17.0", default-features = false, features = ["der", "algorithm"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
bp256 = { version = "0.14.0", default-features = false, features = ["arithmetic", "ecdsa", "sha256"] }
bp384 = { version = "0.14.0", default-features = false, features = ["arithmetic", "ecdsa", "sha384"] }
# Release candidate: the only rsa line on the current RustCrypto stack (docs/development.md).
rsa = { version = "=0.10.0-rc.19", default-features = false, features = ["encoding", "sha2"] }
digest = "0.11"
# ti-cli's HTTP: blocking ureq on rustls with ring passed explicitly, as in kartos; no
# async runtime, no aws-lc build.
# `~`: ti-connector-client's TLS connector uses ureq's semver-exempt `unversioned`
# transport API (docs/development.md, Known compromises).
ureq = { version = "~3.4.2", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "ring"] }
# The operating system's trust store for a Konnektor without a `.kon` trust store; the
# version ureq's `platform-verifier` feature brings.
rustls-platform-verifier = "0.7.1"
# ti-tls: the web profile's paths over the host's roots, with ti-pki's signature algorithms
# (no ring feature: rustls-webpki verifies nothing itself).
rustls-webpki = { version = "0.103.16", default-features = false, features = ["alloc", "std"] }
rustls-native-certs = "0.8.4"
# Hidden password entry in ti-cli's interactive commands (connector config); host only,
# never a core: it reaches the terminal through `unsafe` (termios, the Windows console).
# Exact, with rtoolbox 0.0.6 in the lock file, which promises no compatibility.
# Approved 2026-10-29 (TASK-136).
rpassword = "=7.5.4"

serde_json = "1.0.151"
# The one XML parser: serde, matching local names (as in the zero-lab generator projects).
# It skips a DTD without reading it and refuses any entity it does not know. The TSL is
# read only from bytes its detached signature covers (TSLDET-006).
quick-xml = { version = "0.42.0", default-features = false, features = ["serialize", "overlapped-lists"] }
base64ct = { version = "1.8.3", features = ["alloc"] }
# Constant-time comparison of secrets and tags.
subtle = { version = "2.6.1", default-features = false }
# Only for the generated Konnektor bindings, which are written against it.

# jwz (JOSE): the RustCrypto 0.14 line, no_std; features chosen per crate.
elliptic-curve = { version = "0.14.1", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false }
signature = { version = "3.0.0", default-features = false }
aes-gcm = { version = "0.11.1", default-features = false }
aes-kw = { version = "0.3.1", default-features = false }
rand_core = { version = "0.10.1", default-features = false }
getrandom = { version = "0.4.3", default-features = false }

# unsafe-audit (`just unsafe-free`) parses the dependencies' sources; a development tool,
# never a dependency of a core or the CLI. Versions and features already in the lock file
# through proc macros. Approved 2026-10-29 (TASK-156).
syn = { version = "3.0.6", default-features = false, features = ["full", "visit", "parsing", "printing"] }
proc-macro2 = { version = "1.0.107", default-features = false }
quote = { version = "1.0.47", default-features = false }

# Test-only.
futures-lite = "2.6.1"
# Browser tests of the jwz crates (`just jwz-browser`). 0.3.78 requires wasm-bindgen
# =0.2.128, the version ti-wasm pins and wasm-bindgen-test-runner must equal.
wasm-bindgen-test = "=0.3.78"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# Kani proofs (`just verify-formal`, `just verify-formal-jwz`) are compiled under
# `cfg(kani)`, hax extraction (`just verify-hax-jwz`) under `cfg(hax)`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(hax)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# gematik spec identifiers (gemSpec_PKI, Tab_PKI_405, A_28419, SE_1016) are prose
# in these docs, not code; backticking every one would only hurt readability.
doc_markdown = "allow"
# Async trait impls must be async even when an implementation never awaits (memory
# store, file transport); the trait, not the impl, decides.
unused_async_trait_impl = "allow"

# Release builds are what `just install` and distributed binaries use: stripped, whole
# program optimised, aborting on panic (nothing catches one; the CLI's only panics are
# programming errors). ti-cli shrinks from 6.2 to 3.5 MB on aarch64-apple-darwin.
# Dependencies are built optimized in debug and test builds, the workspace's own crates are not.
# Unoptimized, the curve and RSA arithmetic took most of the time of tests that verify many
# signatures: ti-pki's validate_corpus ran 50 s against nextest's 60 s limit, 13.5 s with this
# (TASK-214). Release, wasm and fuzz builds have their own settings.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"

# `just install-fast`: the release profile, built for quick turnarounds while testing (thin
# LTO, parallel and incremental codegen); `just install` and releases use `release`.
[profile.local]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true

# `just wasm-build`: the release profile for wasm32. Speed stays ahead of size: opt-level
# 3 like release, and wasm-opt -O3; `just wasm-size` holds the size budget.
[profile.wasm]
inherits = "release"
