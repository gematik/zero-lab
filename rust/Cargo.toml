[workspace]
members = ["ti-types", "ti-pki"]
resolver = "3"

# Shared metadata only. Deliberately no workspace.package.version: every crate is
# versioned independently by its own tag rust/<crate>/vX.Y.Z (see docs/development.md).
[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/gematik/zero-lab"
authors = ["gematik GmbH"]
# Until the registry/crates.io decision; flipped here once for every crate.
publish = false

[workspace.dependencies]
# In-repo crates: path for local development, version for registry resolution.
ti-types = { version = "0.1", path = "ti-types" }
ti-pki = { version = "0.1", path = "ti-pki" }

# External. Pinned here once, inherited by every crate. No crypto in library code yet.
der = "0.8"
x509-cert = "0.3"
spki = "0.8"
const-oid = "0.10"
pem-rfc7468 = "1"
thiserror = "2"
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
clap = { version = "4.6.7", default-features = false, features = ["derive"] }

# Test-only.
sha2 = "0.11"
serde_json = "1.0.151"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# gematik spec identifiers (gemSpec_PKI, Tab_PKI_405, A_28419, SE_1016) are prose
# in these docs, not code; backticking every one would only hurt readability.
doc_markdown = "allow"
