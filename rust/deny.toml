[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]
# minicbor (bundle format) is BlueOak-1.0.0: permissive and OSI approved; allowed for
# that crate only rather than for the whole graph.
exceptions = [{ crate = "minicbor", allow = ["BlueOak-1.0.0"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
