[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Marvin timing attack on RSA private-key operations, unpatched in every rsa release.
# ti-pki only verifies signatures (public data); see docs/development.md, "Known
# compromises". Remove once a patched rsa is released.
ignore = [{ id = "RUSTSEC-2023-0071", reason = "verification only, no private-key operations" }]

[licenses]
version = 2
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    # The workspace crates themselves.
    "EUPL-1.2",
    "ISC",
    "Unicode-3.0",
]
# Allowed for single crates only rather than for the whole graph.
exceptions = [
    # Mozilla's root store as data, via rustls-platform-verifier (ti-cli only).
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
