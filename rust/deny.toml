[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Marvin timing attack on RSA private-key operations, unpatched in every rsa release.
# ti-pki only verifies signatures (public data); see docs/development.md, "Known
# compromises". Remove once a patched rsa is released.
ignore = [{ id = "RUSTSEC-2023-0071", reason = "verification only, no private-key operations" }]

[licenses]
version = 2
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]
# minicbor (bundle format) is BlueOak-1.0.0: permissive and OSI approved; allowed for
# that crate only rather than for the whole graph.
exceptions = [{ crate = "minicbor", allow = ["BlueOak-1.0.0"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
