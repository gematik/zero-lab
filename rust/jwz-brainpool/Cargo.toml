[package]
name = "jwz-brainpool"
version = "0.1.0"
description = "Legacy brainpoolP256r1 for jwz: BP256R1 signatures and BP-256 ECDH-ES as used by existing gematik TI interfaces. Not for new components."
keywords = ["jose", "brainpool", "gematik", "telematik"]
categories = ["cryptography", "no-std"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
jwz.workspace = true
# brainpoolP256r1 arithmetic, ECDSA with SHA-256 (RFC 6979 nonces) and ECDH, on the same
# RustCrypto 0.14 line as jwz's own backend.
bp256 = { workspace = true, features = ["alloc"] }
ecdsa.workspace = true
elliptic-curve = { workspace = true, features = ["ecdh", "alloc"] }
# BrainpoolEs256Key implements RustCrypto's signature traits, as jwz's keys do.
signature = { workspace = true, features = ["alloc"] }

[dev-dependencies]
jwz = { workspace = true, features = ["std", "jws", "jwe", "jwt", "crypto-rustcrypto"] }
serde_json.workspace = true

[lints]
workspace = true
