[package]
name = "jwz"
version = "0.1.0"
description = "JOSE (JWS, JWE, JWK, JWT) with an open algorithm registry, pluggable keys and crypto backends, and validation profiles"
keywords = ["jose", "jws", "jwe", "jwk", "jwt"]
categories = ["cryptography", "authentication", "no-std", "wasm"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
homepage = "https://github.com/gematik/zero-lab/blob/main/rust/jwz/README.md"

[features]
default = ["std", "jws", "jwe", "jwt", "crypto-rustcrypto"]
# SystemClock and std error integration; the core is no_std + alloc.
std = []
jws = []
jwe = []
jwt = []
# The pure-Rust default backend (RustCrypto 0.14 line). Exactly one in-crate backend
# may be enabled; external backends implement `jwz::crypto` without a feature here.
crypto-rustcrypto = ["dep:p256", "dep:sha2", "dep:ed25519-dalek", "dep:aes-gcm", "dep:aes-kw", "dep:getrandom"]
# Reserved: RSA crypto is not implemented in milestone 1 (src/lib.rs refuses the build).
rsa = []
# HMAC (HS256/384/512); off by default because shared-secret JWS is rarely what a
# public-key protocol wants.
hmac = ["dep:hmac", "dep:subtle"]
# MockHsmSigner, TestKmsSigner and fixed RNGs for tests in downstream crates.
test-util = []


[dependencies]
# JSON for JOSE objects; serde_json directly (not the workspace entry) to stay no_std.
serde = { workspace = true }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
# Strict, constant-time base64url.
base64ct = { workspace = true }
# RustCrypto's signature traits, which jwz's Signer and Verifier build on.
signature = { workspace = true, features = ["alloc"] }
# Secret outputs of the crypto traits (CEKs, shared secrets, private scalars).
zeroize.workspace = true
# The crypto-rustcrypto backend; each crate is one family of primitives.
p256 = { workspace = true, optional = true, features = ["ecdh", "alloc"] }
sha2 = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true, features = ["fast", "zeroize"] }
aes-gcm = { workspace = true, optional = true, features = ["aes"] }
aes-kw = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
# Constant-time comparison of MACs, tags and thumbprints.
subtle = { workspace = true, optional = true }

# hax annotations (pre- and postconditions of the Concat KDF core); compiled only when
# hax extracts jwz (`just verify-hax-jwz`), never in a normal build.
[target.'cfg(hax)'.dependencies]
hax-lib = { version = "0.4.2", default-features = false, features = ["macros"] }

# A browser has no OS random source: getrandom uses Crypto.getRandomValues there.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, optional = true, features = ["wasm_js"] }

[dev-dependencies]
futures-lite.workspace = true
serde_json.workspace = true

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test.workspace = true

[lints]
workspace = true
