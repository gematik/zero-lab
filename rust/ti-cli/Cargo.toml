[package]
name = "ti-cli"
version = "0.6.0-rc.3"
description = "Command-line tool for the gematik Telematikinfrastruktur (TI): certificates and trust material"
keywords = ["gematik", "telematik", "pki", "cli"]
categories = ["command-line-utilities", "cryptography"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "ti"
path = "src/main.rs"

[dependencies]
# Its transports, files and block_on: the host it shares with the desktop app.
ti-client.workspace = true
# A tool for every environment: the non-prod presets are in; TrustConfig::validate
# still fences production from TEST-ONLY material.
ti-pkcs12 = { workspace = true, features = ["encode"] }
ti-connector-client.workspace = true
# The protected header `identity sign` shows, decoded from its JWS.
base64ct.workspace = true
ti-pki = { workspace = true, features = ["brainpool", "rsa", "os", "dangerous-nonprod", "serde"] }
# `identity sign`'s header parameters and algorithm names; the identity signs in ti-client.
# The owner login's test signs with a brainpoolP256r1 key of its own.
jwz = { workspace = true, features = ["std", "jws", "jwt", "crypto-rustcrypto"] }
ti-jwz = { workspace = true, features = ["legacy"] }
# `idpd authenticate`: the IDP-Dienst flow over ti-client's ureq.
ti-idpd-client.workspace = true
# `directory login`: the FHIR-Directory's token paths over the same transport; the owner
# login by card joins its steps with ti-idpd-client's flow here.
ti-directory-client.workspace = true
clap = { workspace = true, features = ["std", "help", "usage", "error-context", "suggestions", "color", "env"] }
clap_complete.workspace = true
anstream.workspace = true
anstyle.workspace = true
jiff.workspace = true
ti-types.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
traceability.workspace = true
# The fakes' TLS servers: a Konnektor, and a host the probe refuses.
rustls.workspace = true
# The digests the tests recompute: the cache's file names, a pinned certificate's.
sha2.workspace = true
# The fakes' certificates and keys, read from PEM.
pem-rfc7468 = { workspace = true, features = ["alloc"] }
sec1.workspace = true

[lints]
workspace = true
