[package]
name = "ti-cli"
version = "0.1.0"
description = "Command-line tool for the gematik Telematikinfrastruktur (TI): certificates and trust material"
keywords = ["gematik", "telematik", "pki", "cli"]
categories = ["command-line-utilities", "cryptography"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# `tir` ("ti in Rust") until it covers what the Go `ti` does; then it becomes `ti`.
[[bin]]
name = "tir"
path = "src/main.rs"

[dependencies]
# A tool for every environment: the non-prod presets are in; TrustConfig::validate
# still fences production from TEST-ONLY material.
ti-pki = { workspace = true, features = ["os", "dangerous-nonprod"] }
# rustls without a built-in provider (ring is passed in), the OS trust store via the
# platform verifier, and SOCKS for -x socks5://.
ureq = { workspace = true, features = ["rustls-no-provider", "platform-verifier", "socks-proxy"] }
rustls.workspace = true
clap = { workspace = true, features = ["std", "help", "usage", "error-context", "suggestions", "color", "env"] }
anstream.workspace = true
anstyle.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
x509-cert.workspace = true

[lints]
workspace = true
