[package]
name = "ti-cli"
version = "0.5.0"
description = "Command-line tool for the gematik Telematikinfrastruktur (TI): certificates and trust material"
keywords = ["gematik", "telematik", "pki", "cli"]
categories = ["command-line-utilities", "cryptography"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "ti"
path = "src/main.rs"

[dependencies]
# A tool for every environment: the non-prod presets are in; TrustConfig::validate
# still fences production from TEST-ONLY material.
ti-pkcs12 = { workspace = true, features = ["encode"] }
ti-connector-client = { workspace = true, features = ["ureq"] }
# base64url of the IDP's signed discovery document in `probe`.
base64ct.workspace = true
ti-pki = { workspace = true, features = ["brainpool", "rsa", "os", "dangerous-nonprod", "serde"] }
# `identity sign`: JWS with the SMC-B or HBA key, ES256 on brainpoolP256r1 (ti-jwz's brainpool) or
# P-256 (jwz's own backend); the keys come from PKCS#8 (`pkcs8`, `sec1`), not from JWKs.
jwz = { workspace = true, features = ["std", "jws", "jwt", "crypto-rustcrypto"] }
ti-jwz = { workspace = true, features = ["legacy"] }
# `idpd authenticate`: the IDP-Dienst flow over this tool's ureq.
ti-idpd-client = { workspace = true, features = ["ureq"] }
# `directory login`: the FHIR-Directory's token paths over the same transport; the owner
# login by card joins its steps with ti-idpd-client's flow here.
ti-directory-client.workspace = true
pkcs8.workspace = true
sec1.workspace = true
der.workspace = true
zeroize.workspace = true
# rustls without a built-in provider (ring is passed in); the trust is ti-tls's.
ureq = { workspace = true, features = ["rustls-no-provider"] }
# Every https server verified under spec/pki-validation's web profile.
ti-tls = { workspace = true, features = ["ureq"] }
rustls.workspace = true
clap = { workspace = true, features = ["std", "help", "usage", "error-context", "suggestions", "color", "env"] }
clap_complete.workspace = true
anstream.workspace = true
anstyle.workspace = true
jiff.workspace = true
pem-rfc7468 = { workspace = true, features = ["alloc"] }
ti-cache.workspace = true
ti-types.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
x509-cert.workspace = true

[dev-dependencies]
traceability.workspace = true

[lints]
workspace = true
