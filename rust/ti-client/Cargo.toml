[package]
name = "ti-client"
version = "0.1.0"
description = "The native host of the gematik Telematikinfrastruktur (TI) crates: their transports over ureq, the file storage and block_on, shared by the command-line tool and the desktop app"
keywords = ["gematik", "telematik"]
categories = ["network-programming"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
ti-cache.workspace = true
ti-types.workspace = true
ti-connector-client.workspace = true
ti-idpd-client.workspace = true
ti-directory-client.workspace = true
# The transport of roots.json, the TSL and OCSP (`load`), and the OCSP media types; the
# trust material of every environment, the non-prod presets fenced by TrustConfig::validate.
ti-pki = { workspace = true, features = ["load", "os", "dangerous-nonprod"] }
# The error of a PKCS#12 file that cannot be opened.
ti-pkcs12.workspace = true
# The Konnektor's TLS trust (`konnektor`); this crate only wires it into ureq.
ti-tls.workspace = true
# Blocking HTTP without an async runtime; the TLS layer is ti-tls's rustls configuration
# in a connector of our own (`unversioned` API, hence ureq pinned `~3.4`).
ureq = { workspace = true, features = ["rustls-no-provider"] }
rustls.workspace = true
rustls-pki-types = { workspace = true, features = ["std"] }
# The operating system's trust store for a Konnektor without a `.kon` trust store.
rustls-platform-verifier.workspace = true
# Completes EC client keys that lack their public key, which ring requires.
p256 = { workspace = true, features = ["pkcs8", "alloc"] }
p384 = { workspace = true, features = ["pkcs8", "alloc"] }
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
# The cache file names and path components: a hash of the key.
sha2.workspace = true

[dev-dependencies]
base64ct.workspace = true
traceability.workspace = true
# The Konnektor e2e test checks an ExternalAuthenticate signature against the card's C.AUT;
# the trust tests verify the production TSL of spec/tsl-detached, read from files (`os`).
ti-pki = { workspace = true, features = ["brainpool", "os"] }

[lints]
workspace = true
