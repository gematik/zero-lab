[package]
name = "ti-connector-client"
version = "0.1.0"
description = "Client for the gematik Konnektor's SOAP services in the Telematikinfrastruktur (TI), with pluggable HTTP transport"
keywords = ["gematik", "telematik", "konnektor", "soap"]
categories = ["api-bindings", "wasm"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
# Captured Konnektor responses are test data only.
exclude = ["tests/"]

[dependencies]
ti-types.workspace = true
ti-cache.workspace = true
ti-pki.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
quick-xml.workspace = true
# The generated code's xs:base64Binary, in constant time.
base64ct.workspace = true
sha2.workspace = true
# The client certificate of `pkcs12` credentials: the redacted view, the checks and the
# identity the host presents in the handshake.
ti-pkcs12.workspace = true
thiserror.workspace = true

[dev-dependencies]
traceability.workspace = true
futures-lite.workspace = true
rustls-pki-types = { workspace = true, features = ["std"] }
# The recorded ExternalAuthenticate signature is checked against the card's C.AUT.
ti-pki = { workspace = true, features = ["brainpool"] }

[lints]
workspace = true
