# cargo-fuzz targets for ti-directory-client's parsers of the FHIR-Directory's answers (nightly;
# `just fuzz-ti-directory-client`). Outside the workspace so that libfuzzer never enters the
# workspace's lock file and checks.
[package]
name = "ti-directory-client-fuzz"
version = "0.0.0"
edition = "2024"
license = "EUPL-1.2"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4.13"
ti-directory-client = { path = ".." }

[[bin]]
name = "owner_redirect"
path = "fuzz_targets/owner_redirect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "token"
path = "fuzz_targets/token.rs"
test = false
doc = false
bench = false

[[bin]]
name = "keycloak_token"
path = "fuzz_targets/keycloak_token.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sign_in"
path = "fuzz_targets/sign_in.rs"
test = false
doc = false
bench = false
