[package]
name = "ti-hsm-proxy"
version = "0.0.0"
description = "The HSM proxy sidecar of a gematik Telematikinfrastruktur (TI) workload: gematik's HSM proxy interface on keys reached over PKCS#11 alone"
keywords = ["hsm", "pkcs11", "gematik", "telematik", "zeta"]
categories = ["cryptography"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "hsm-proxy"
path = "src/main.rs"

[features]
default = ["grpc"]
# What every transport shares: the listener (Unix socket, TLS, plaintext) and the sidecar's own TLS.
transport = [
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:rustls-pki-types",
]
# The gRPC transport of gematik.zetaguard.hsmproxy.v1.HsmProxyService and grpc.health.v1
# (gemSpec_ZETA A_28829). Without a transport the crate is the PKCS#11 adapter and the
# operations, and the binary serves nothing.
grpc = [
    "transport",
    "dep:tonic",
    "dep:tonic-prost",
    "dep:prost",
    "dep:tonic-health",
    "dep:hyper-util",
    "dep:tower",
]
# The simulator mode (HSM_PROXY_SIMULATOR): provisions a software token with TEST-ONLY PINs and
# makes missing keys. For the development image only, never in a production build (rule 17).
simulator = ["dep:hmac", "dep:p256", "dep:p384"]
# Probes that ask a token to do what it must refuse, for the conformance suite against a token
# (tests/token_softhsm2.rs); never in a production build (servers.md rule 17).
conformance = []

[dependencies]
cryptoki.workspace = true
thiserror.workspace = true
sha2.workspace = true
const-oid = { workspace = true, features = ["db"] }
der.workspace = true
x509-cert.workspace = true
spki.workspace = true
pem-rfc7468 = { workspace = true, features = ["alloc"] }
base64ct.workspace = true
serde.workspace = true
serde_json.workspace = true
# The client half (`channel`) is for `hsm-proxy health`, the probe of the own socket.
tonic = { workspace = true, optional = true, features = ["channel"] }
tonic-prost = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
tonic-health = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
# The simulator's keys derived from a seed (feature simulator): HKDF on HMAC-SHA256, and the
# public point of a derived scalar.
hmac = { workspace = true, optional = true }
p256 = { workspace = true, optional = true, features = ["alloc", "pkcs8"] }
p384 = { workspace = true, optional = true, features = ["alloc", "pkcs8"] }
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true, features = ["alloc"] }

# Signatures are checked by the verifiers ti-pki uses, not by the token itself.
[dev-dependencies]
# The TLS profile is ti-tls's (TLSV-010 to 012); a test holds the sidecar's to it.
ti-tls.workspace = true
# The TLS suite makes its CA and certificates in the test, keys included (no key in a fixture).
x509-cert = { workspace = true, features = ["builder"] }
getrandom = { workspace = true, features = ["std"] }
# A TLS client for the TCP listener's tests.
tonic = { workspace = true, features = ["channel", "tls-ring"] }
ecdsa = { workspace = true, features = ["pkcs8", "alloc"] }
p256 = { workspace = true, features = ["pkcs8", "alloc"] }
p384.workspace = true
bp256.workspace = true
sha2.workspace = true

# The adapter's conformance suite needs the probes of the `conformance` feature.
[[test]]
name = "token_softhsm2"
required-features = ["conformance"]

[[test]]
name = "recovery_softhsm2"
required-features = ["conformance"]

[[test]]
name = "simulator_softhsm2"
required-features = ["simulator"]

[lints]
workspace = true
