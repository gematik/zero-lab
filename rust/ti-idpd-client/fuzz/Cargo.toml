# cargo-fuzz targets for ti-idpd-client's parsers of the IDP-Dienst's answers (nightly;
# `just fuzz-ti-idpd-client`). Outside the workspace so that libfuzzer never enters the
# workspace's lock file and checks.
[package]
name = "ti-idpd-client-fuzz"
version = "0.0.0"
edition = "2024"
license = "EUPL-1.2"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4.13"
ti-idpd-client = { path = ".." }
ti-types = { path = "../../ti-types" }

[[bin]]
name = "discovery"
path = "fuzz_targets/discovery.rs"
test = false
doc = false
bench = false

[[bin]]
name = "key"
path = "fuzz_targets/key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "challenge"
path = "fuzz_targets/challenge.rs"
test = false
doc = false
bench = false

[[bin]]
name = "code_redirect"
path = "fuzz_targets/code_redirect.rs"
test = false
doc = false
bench = false
