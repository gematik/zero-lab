[package]
name = "ti-idpd"
version = "0.1.0"
description = "Client of the gematik IDP-Dienst (the central smartcard IDP): the Authenticator-Modul flow a Primärsystem runs, sans I/O, with a ureq adapter"
keywords = ["gematik", "telematik", "idp", "oidc", "brainpool"]
categories = ["authentication", "wasm"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# A blocking transport over ureq 3, for the CLI. The core does no I/O.
ureq = ["dep:ureq"]

[dependencies]
# JOSE: the IDP speaks BP256R1 and ECDH-ES on BP-256 (gemSpec_IDP_Dienst), so the TI
# legacy profile and the brainpool registry and backend.
jwz = { workspace = true, features = ["std", "jws", "jwe", "jwt", "crypto-rustcrypto"] }
jwz-brainpool.workspace = true
ti-jwz = { workspace = true, features = ["legacy"] }
# The IDP's certificates in `x5c`: parsing only, no algorithm features.
ti-pki.workspace = true
ti-types.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
thiserror.workspace = true
ureq = { workspace = true, optional = true, features = ["rustls-no-provider"] }

[dev-dependencies]
ti-pki = { workspace = true, features = ["brainpool"] }
# The TEST-ONLY IDP signer's key (tests/fixtures/idp-sig.key, SEC1 PEM).
sec1.workspace = true
pem-rfc7468 = { workspace = true, features = ["alloc"] }
base64ct.workspace = true

[lints]
workspace = true
