[package]
name = "ti-jwks"
version = "0.1.0"
description = "JWK Sets from a jwks_uri for gematik Telematikinfrastruktur (TI) components: fetched through any transport, cached by ti-cache, refreshed on an unknown kid at a bounded rate"
keywords = ["jose", "jwks", "gematik", "telematik", "cache"]
categories = ["authentication", "caching", "wasm"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# A blocking transport over ureq 3, for CLIs and servers. The core does no I/O.
ureq = ["dep:ureq"]

[dependencies]
# Parsing the set and judging a key's use; no algorithm features, the caller verifies.
jwz.workspace = true
ti-cache.workspace = true
ti-types.workspace = true
thiserror.workspace = true
ureq = { workspace = true, optional = true, features = ["rustls-no-provider"] }

[dev-dependencies]
traceability.workspace = true
futures-lite.workspace = true
# The agent for the ureq transport's loopback test.
ureq = { workspace = true, features = ["rustls-no-provider"] }

[lints]
workspace = true
