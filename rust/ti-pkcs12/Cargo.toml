[package]
name = "ti-pkcs12"
version = "0.1.0"
description = "PKCS#12 (RFC 7292) decoding for gematik Telematikinfrastruktur (TI) identities, BER and legacy PBEs included"
keywords = ["pkcs12", "pfx", "gematik", "telematik"]
categories = ["cryptography", "parser-implementations"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
# Test fixtures (copied from go/pkcs12) are test data only.
exclude = ["tests/"]

[features]
# The PKCS#12 PBEs of RFC 7292 Appendix C (3DES, RC2) and DES-EDE3 in PBES2: what
# OpenSSL's `-legacy`, Java keystores and gematik's card vendors still produce.
default = ["legacy"]
legacy = ["dep:cbc", "dep:des", "dep:rc2", "pkcs5/3des", "pkcs5/sha1-insecure"]
# Writing PKCS#12 (PBES2/AES-256, SHA-256 MAC); the caller supplies the randomness.
encode = []

[dependencies]
# BER: Java keystores and card vendors write indefinite lengths and constructed strings.
der = { workspace = true, features = ["ber"] }
spki.workspace = true
pkcs5.workspace = true
pkcs8.workspace = true
hmac.workspace = true
sha1.workspace = true
sha2.workspace = true
zeroize.workspace = true
thiserror.workspace = true
cbc = { workspace = true, optional = true }
des = { workspace = true, optional = true }
rc2 = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
