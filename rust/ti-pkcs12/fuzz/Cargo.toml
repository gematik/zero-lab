# cargo-fuzz targets for ti-pkcs12 (nightly; `just fuzz-ti-pkcs12`).
# Outside the workspace so that libfuzzer never enters the workspace's lock file and checks.
[package]
name = "ti-pkcs12-fuzz"
version = "0.0.0"
edition = "2024"
license = "EUPL-1.2"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4.13"
ti-pkcs12 = { path = ".." }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false
