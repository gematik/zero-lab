[package]
name = "ti-pki"
version = "0.1.0"
description = "X.509 certificate validation against the gematik Telematikinfrastruktur (TI) PKI"
keywords = ["x509", "pki", "gematik", "telematik", "ocsp"]
categories = ["cryptography", "authentication"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
# Wycheproof vectors are test data only.
exclude = ["tests/"]

[features]
# The TI's anchors are brainpool keys, so the TI path needs it; turn default features
# off to build without it.
default = ["brainpool", "rsa"]
# ECDSA on brainpoolP256r1 / brainpoolP384r1, added to the default algorithm set.
brainpool = ["dep:bp256", "dep:bp384"]
# RSA PKCS#1 v1.5 and PSS in the default algorithm set; the TI's historical roots are RSA.
rsa = ["dep:rsa", "dep:sha2", "dep:digest"]
# Presets carrying TEST-ONLY anchors and relaxed policies. A production binary is built
# without this feature and therefore contains no non-prod trust material.
dangerous-nonprod = []
# Config helpers, clocks and a scripted transport for tests in downstream crates.
# Never a default feature.
test-util = []
# Loading layer: traits, loaders, cache and reloader. Runtime-agnostic, builds for wasm32.
load = ["dep:arc-swap", "dep:sha2", "dep:minicbor"]
# Operating-system facilities: file transport, system clock, bundle files.
os = ["load"]
# Transport over a caller-provided reqwest::Client (native and wasm32).
reqwest = ["load", "dep:reqwest"]
# Background reloader, SIGHUP and admin trigger on tokio. Not for wasm32.
tokio = ["load", "os", "dep:tokio", "dep:tracing"]

[dependencies]
ti-types.workspace = true
der.workspace = true
x509-cert.workspace = true
const-oid.workspace = true
pem-rfc7468.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
quick-xml.workspace = true
base64ct.workspace = true
rustls-pki-types.workspace = true
ecdsa.workspace = true
p256.workspace = true
p384.workspace = true
bp256 = { workspace = true, optional = true }
bp384 = { workspace = true, optional = true }
rsa = { workspace = true, optional = true }
digest = { workspace = true, optional = true }
arc-swap = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
minicbor = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "time", "sync", "macros", "signal"] }
tracing = { workspace = true, optional = true }

[dev-dependencies]
sha2.workspace = true
futures-lite.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
