[package]
name = "ti-pki"
version = "0.1.0"
description = "X.509 certificate validation against the gematik Telematikinfrastruktur (TI) PKI"
keywords = ["x509", "pki", "gematik", "telematik", "ocsp"]
categories = ["cryptography", "authentication"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# Presets carrying TEST-ONLY anchors and relaxed policies. A production binary is built
# without this feature and therefore contains no non-prod trust material.
dangerous-nonprod = []
# Config helpers for tests in downstream crates. Never a default feature.
test-util = []

[dependencies]
ti-types.workspace = true
der.workspace = true
x509-cert.workspace = true
spki.workspace = true
const-oid.workspace = true
pem-rfc7468.workspace = true
thiserror.workspace = true

[dev-dependencies]
sha2.workspace = true

[lints]
workspace = true

# Declared for the parsing layer the port adds next; remove each entry once the
# crate uses it, so machete guards it from then on.
[package.metadata.cargo-machete]
ignored = ["spki", "pem-rfc7468"]
