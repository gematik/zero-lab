# cargo-fuzz targets for what ti-wasm hands ti-report from a web page: certificates and TSL files
# (nightly; `just fuzz-ti-report`). Outside the workspace so that libfuzzer never enters the
# workspace's lock file and checks.
[package]
name = "ti-report-fuzz"
version = "0.0.0"
edition = "2024"
license = "EUPL-1.2"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4.13"
ti-wasm = { path = "../../ti-wasm" }

[[bin]]
name = "describe_certificate"
path = "fuzz_targets/describe_certificate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify_tsl"
path = "fuzz_targets/verify_tsl.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify_tsl_roots"
path = "fuzz_targets/verify_tsl_roots.rs"
test = false
doc = false
bench = false
