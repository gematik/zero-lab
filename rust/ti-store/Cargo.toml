[package]
name = "ti-store"
version = "0.1.0"
description = "Storage for gematik Telematikinfrastruktur (TI) clients: HTTP-style caching (freshness, revalidation, stale-on-error) over pluggable stores"
keywords = ["cache", "storage", "etag", "gematik", "telematik"]
categories = ["caching", "wasm"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# The sealed store of spec/store: records, names, keyring, profiles and the memory backend,
# with the software crypto it needs. Cache-only users do not pay for it.
store = ["dep:aes-gcm", "dep:hkdf", "dep:hmac", "dep:sha2", "dep:zeroize", "dep:getrandom"]
# FixedRandom, for reproducible records in tests and the conformance adapter.
test-util = ["store"]

[dependencies]
ti-types.workspace = true
thiserror.workspace = true
aes-gcm = { workspace = true, optional = true, features = ["aes"] }
hkdf = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }

# A browser has no OS random source: getrandom uses Crypto.getRandomValues there.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, optional = true, features = ["wasm_js"] }

[dev-dependencies]
futures-lite.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize.workspace = true

[[example]]
name = "conformance"
required-features = ["test-util"]

[lints]
workspace = true
